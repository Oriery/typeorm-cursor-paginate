name: v3 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:package
        env:
          PACKAGE_OUTPUT_DIR: artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: v3-release-candidate
          path: artifacts/*.tgz
          if-no-files-found: error

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Target actual floors and current branches, not a redundant Cartesian product.
      matrix:
        include:
          - node: 22.13.0
            typeorm: 0.3.21
            sqlite: 11.10.0
            typescript: 5.7.3
          - node: 22.13.0
            typeorm: 1.0.0
            sqlite: 12.11.1
            typescript: 5.7.3
          - node: 24.11.0
            typeorm: 1.0.0
            sqlite: 12.11.1
            typescript: 6.0.3
          - node: 26.0.0
            typeorm: 1.0.0
            sqlite: 12.11.1
            typescript: 6.0.3
          - node: 22.x
            typeorm: "0.3"
            sqlite: 12.11.1
            typescript: "5"
          - node: 26.x
            typeorm: "1"
            sqlite: 12.11.1
            typescript: "6"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: paginator-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAGINATOR_POSTGRES_URL: postgres://postgres:paginator-test-only@localhost:5432/postgres
      PACKAGE_TYPEORM_VERSION: ${{ matrix.typeorm }}
      PACKAGE_SQLITE_VERSION: ${{ matrix.sqlite }}
      PACKAGE_TYPESCRIPT_VERSION: ${{ matrix.typescript }}
      PACKAGE_NODE_TYPES_VERSION: 22.20.5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install the compatible TypeORM and SQLite pair
        run: npm install --no-save --package-lock=false typeorm@${{ matrix.typeorm }} better-sqlite3@${{ matrix.sqlite }}
      - run: npm run typecheck
      - run: npm run test:unit -- --testPathIgnorePatterns=postgres-regressions
      - run: npm run test:postgres
      - run: npm run test:package
