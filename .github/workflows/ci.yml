# This workflow will do a clean installation of node dependencies, cache/restore them, run tests across different versions of node

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # both ends of the `typeorm` peer range, so a new major cannot break
        # consumers unnoticed
        typeorm-version: ["0.3", "1"]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Install typeorm ${{ matrix.typeorm-version }}
      run: npm install --no-save typeorm@${{ matrix.typeorm-version }}
    - run: npm test
      timeout-minutes: 1
